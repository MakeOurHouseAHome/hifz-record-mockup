<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hifz Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: one phone-shaped app frame (full-bleed on a phone), role switcher above, bottom tab bar, juz detail as a bottom sheet. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#F3F6F4; --line:#DCE4E0;
  --ink:#14231F; --muted:#5F716B; --brand:#0E5A4F; --brand-ink:#FFFFFF; --brand-soft:#D7E9E4;
  --g:#2F8F57; --a:#D9961E; --r:#C8483A; --g-soft:#DDF0E4; --a-soft:#FBEED3; --r-soft:#F7DEDA;
  --empty:#E2E8E5; --part:#0E5A4F;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1412; --surface:#13201C; --sunk:#0F1A17; --line:#25352F;
  --ink:#E6EEEB; --muted:#94A7A0; --brand:#45A795; --brand-ink:#06110F; --brand-soft:#173A33;
  --g:#4CB577; --a:#E2A93E; --r:#E06A5A; --g-soft:#173826; --a-soft:#3A2E14; --r-soft:#3D1D19;
  --empty:#1C2925; --part:#45A795; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1412; --surface:#13201C; --sunk:#0F1A17; --line:#25352F;
  --ink:#E6EEEB; --muted:#94A7A0; --brand:#45A795; --brand-ink:#06110F; --brand-soft:#173A33;
  --g:#4CB577; --a:#E2A93E; --r:#E06A5A; --g-soft:#173826; --a-soft:#3A2E14; --r-soft:#3D1D19;
  --empty:#1C2925; --part:#45A795; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);padding-inline:16px;padding-block:18px 40px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}

.top{max-width:430px;margin:0 auto 12px;display:flex;flex-direction:column;gap:8px}
.top h1{font-size:20px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.roles button{border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

.phone{max-width:430px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;height:820px;position:relative;box-shadow:0 20px 50px -30px rgba(10,40,35,.45)}
.bar{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.bar .who{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.bar h2{font-size:20px}
.date{font-size:12px;color:var(--muted);text-align:right}
.screen{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--sunk)}
.tabs button{border:0;background:none;padding:10px 2px 12px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button[aria-current="page"]{color:var(--brand)}
.tabs svg{width:22px;height:22px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;padding:0 4px;border-radius:8px;background:var(--r);color:#fff;font-size:10px;line-height:16px}

.card{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.card.sunk{background:var(--sunk)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.part{display:flex;align-items:center;gap:8px}
.part .tag{font-family:var(--display);font-weight:800;color:var(--brand-ink);background:var(--brand);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px}
.part h3{font-size:16px}
.big{font-family:var(--display);font-weight:700;font-size:17px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.sq{border-radius:9px;padding:6px 9px;min-width:40px;justify-content:center}
.rag{flex:1;justify-content:center;padding:9px 6px}
.rag .d{width:10px;height:10px;border-radius:50%}
.rag.E .d{background:var(--g)} .rag.G .d{background:var(--a)} .rag.N .d{background:var(--r)}
.rag.E[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.rag.G[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff}
.rag.N[aria-pressed="true"]{background:var(--r);border-color:var(--r);color:#fff}
.rag[aria-pressed="true"] .d{background:#fff}
.gpill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.gpill.E{background:var(--g-soft);color:var(--g)} .gpill.G{background:var(--a-soft);color:var(--a)} .gpill.N{background:var(--r-soft);color:var(--r)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.pill.ok{color:var(--g);border-color:var(--g)} .pill.wait{color:var(--a);border-color:var(--a)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.stepper button{border:0;background:none;width:32px;height:32px;font-size:18px;line-height:1}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.count{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
input[type=number],input[type=text],input[type=time],textarea{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit}
input[type=number]{width:64px;text-align:center}
textarea{width:100%;resize:vertical;min-height:54px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:var(--brand-ink);font-weight:700;width:100%}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--sunk);border-radius:9px;width:32px;height:32px;display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}
.check{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--brand);margin:0;flex:none}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.switch{width:44px;height:26px;border-radius:13px;border:0;background:var(--empty);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--brand)} .switch[aria-checked="true"]::after{left:21px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0;position:relative}
.tile .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.tile .ic svg{width:20px;height:20px}
.tile b{font-size:14px;line-height:1.2}
.tile small{font-size:12px;color:var(--muted)}
.tile .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.tile.done{background:var(--g-soft);border-color:var(--g)}
.tile.done .ic{background:var(--g);color:#fff}
.tile.done .tick{background:var(--g);border-color:var(--g);color:#fff}
.tile .tick svg{width:12px;height:12px}

/* juz grid */
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.jz{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:var(--empty);position:relative;overflow:hidden;padding:0;display:flex;align-items:flex-end;justify-content:flex-start}
.jz .f{position:absolute;inset:auto 0 0 0}
.jz .f.G{background:var(--g)} .jz .f.A{background:var(--a)} .jz .f.R{background:var(--r)} .jz .f.P{background:var(--part)}
.jz span{position:relative;font-weight:800;font-size:13px;padding:4px 6px;font-family:var(--display)}
.jz.full span{color:#fff}
.jz[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.jz:disabled{opacity:.45;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* hero */
.hero{display:flex;gap:14px;align-items:center}
.hero svg.ring{flex:none}
.hero .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.meter{height:10px;border-radius:5px;background:var(--empty);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:5px}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--a)}
.streak svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;font-weight:600}
.week div{padding:7px 0;border-radius:8px;background:var(--empty)}
.week .ok{background:var(--g);color:#fff}
.week .heard{box-shadow:inset 0 0 0 2px var(--a)}
.week .today{outline:2px solid var(--ink);outline-offset:-2px}
.week .off{background:none;border:1px dashed var(--line);color:var(--muted)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:3px}
.dots i.E{background:var(--g)} .dots i.G{background:var(--a)} .dots i.N{background:var(--r)}
.chart{width:100%;height:auto;display:block}
.mile{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:14px}
.mile .m{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.mile .m.done{background:var(--g);border-color:var(--g)}
.mile .m.now{border-color:var(--brand);background:var(--brand-soft)}
input[type=range]{width:100%;accent-color:var(--brand)}
.dayrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:14px}
.dayrow.today{border-color:var(--brand)}
.dayrow b{font-size:13px}
.lock{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
.lock svg{width:18px;height:18px;flex:none}
.taskrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:14px}
.taskrow small{color:var(--muted)}

/* messages */
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.msg .from{font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
.sys{align-self:center;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;text-align:center}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0}
.composer .btn{width:auto}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(5,15,12,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;max-height:86%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.surah{display:grid;grid-template-columns:1fr 90px 42px;gap:8px;align-items:center;font-size:14px}
.surah .meter{height:8px}
.surah .meter i.full{background:var(--g)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);z-index:10}
@media (max-width:470px){body{padding-inline:0;padding-block:0}.top{padding:12px 16px 0}.phone{border-radius:0;border-inline:0;height:calc(100vh - 110px);min-height:600px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px)}}}
</style>

<div class="top">
  <h1>Hifz Record <span class="muted small" style="font-family:var(--body);font-weight:500">· mock-up v2, example data</span></h1>
  <div class="roles" role="group" aria-label="View as">
    <button id="r-teacher" data-role="teacher">Teacher</button>
    <button id="r-parent" data-role="parent">Parent</button>
    <button id="r-student" data-role="student">Yusuf</button>
  </div>
</div>

<div class="phone" id="phone">
  <div class="bar">
    <div><div class="who" id="who"></div><h2 id="title"></h2></div>
    <div class="date num">Wed 14 Oct</div>
  </div>
  <div class="screen" id="screen"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="sheetHost"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== Madani 15-line mushaf: 604 pages ===== */
const LPP = 15, TOTAL = 604 * LPP;
const abs = (p, l) => (p - 1) * LPP + l;
const pos = a => ({ p: Math.floor((a - 1) / LPP) + 1, l: ((a - 1) % LPP) + 1 });
const fmt = (a, b) => { const x = pos(a), y = pos(b); return x.p === y.p ? `p.${x.p} L${x.l}–${y.l}` : `p.${x.p}${x.l > 1 ? " L" + x.l : ""} → p.${y.p}${y.l < 15 ? " L" + y.l : ""}`; };
const juzA = k => abs(k === 1 ? 1 : 2 + 20 * (k - 1), 1);
const juzB = k => k === 30 ? TOTAL : juzA(k + 1) - 1;
const SUR = "Al-Fatihah,1|Al-Baqarah,2|Al-Imran,50|An-Nisa,77|Al-Ma'idah,106|Al-An'am,128|Al-A'raf,151|Al-Anfal,177|At-Tawbah,187|Yunus,208|Hud,221|Yusuf,235|Ar-Ra'd,249|Ibrahim,255|Al-Hijr,262|An-Nahl,267|Al-Isra,282|Al-Kahf,293|Maryam,305|Ta-Ha,312|Al-Anbiya,322|Al-Hajj,332|Al-Mu'minun,342|An-Nur,350|Al-Furqan,359|Ash-Shu'ara,367|An-Naml,377|Al-Qasas,385|Al-Ankabut,396|Ar-Rum,404|Luqman,411|As-Sajdah,415|Al-Ahzab,418|Saba,428|Fatir,434|Ya-Sin,440|As-Saffat,446|Sad,453|Az-Zumar,458|Ghafir,467|Fussilat,477|Ash-Shura,483|Az-Zukhruf,489|Ad-Dukhan,496|Al-Jathiyah,499|Al-Ahqaf,502|Muhammad,507|Al-Fath,511|Al-Hujurat,515|Qaf,518|Adh-Dhariyat,520|At-Tur,523|An-Najm,526|Al-Qamar,528|Ar-Rahman,531|Al-Waqi'ah,534|Al-Hadid,537|Al-Mujadilah,542|Al-Hashr,545|Al-Mumtahanah,549|As-Saff,551|Al-Jumu'ah,553|Al-Munafiqun,554|At-Taghabun,556|At-Talaq,558|At-Tahrim,560|Al-Mulk,562|Al-Qalam,564|Al-Haqqah,566|Al-Ma'arij,568|Nuh,570|Al-Jinn,572|Al-Muzzammil,574|Al-Muddaththir,575|Al-Qiyamah,577|Al-Insan,578|Al-Mursalat,580|An-Naba,582|An-Nazi'at,583|Abasa,585|At-Takwir,586|Al-Infitar,587|Al-Mutaffifin,587|Al-Inshiqaq,589|Al-Buruj,590|At-Tariq,591|Al-A'la,591|Al-Ghashiyah,592|Al-Fajr,593|Al-Balad,594|Ash-Shams,595|Al-Layl,595|Ad-Duha,596|Ash-Sharh,596|At-Tin,597|Al-Alaq,597|Al-Qadr,598|Al-Bayyinah,598|Az-Zalzalah,599|Al-Adiyat,599|Al-Qari'ah,600|At-Takathur,600|Al-Asr,601|Al-Humazah,601|Al-Fil,601|Quraysh,602|Al-Ma'un,602|Al-Kawthar,602|Al-Kafirun,603|An-Nasr,603|Al-Masad,603|Al-Ikhlas,604|Al-Falaq,604|An-Nas,604"
  .split("|").map((s, i) => { const [n, p] = s.split(","); return { i: i + 1, n, p: +p }; });
SUR.forEach((s, i) => { const nx = SUR[i + 1]; s.a = abs(s.p, 1); s.b = nx ? (nx.p > s.p ? abs(nx.p - 1, 15) : abs(s.p, 15)) : TOTAL; });
const surahAt = a => [...SUR].reverse().find(s => s.a <= a);
const KAHF = SUR[17];
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], TODAY = "Wed", NOW = new Date(2026, 9, 14);
const G = { E: "Excellent", G: "Good", N: "Not good" };
const monthYr = d => d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
const addWeeks = w => new Date(NOW.getTime() + w * 7 * 864e5);

/* ===== Example state ===== */
const S = {
  role: "student", tab: "today", sheet: null, editDay: null,
  juz1Done: abs(7, 5),
  lastRev: { 30: 1, 29: 9, 28: 0, 27: 19, 15: 12, 16: 12, 1: 1 },
  completed: { 30: ["Feb 2025", 20], 29: ["Jul 2025", 19], 28: ["Dec 2025", 21], 27: ["May 2026", 20], 15: ["Sep 2026", 6], 16: ["Sep 2026", 6] },
  juzGrades: { 30: "EEGE", 29: "GEGG", 28: "GGNG", 27: "GNGG", 15: "EGE", 16: "EGE", 1: "GEEG" },
  history: { A: "EGGEGNGGEEGGGEGNGEGG".split(""), B: "GEEGEGGEENGEEGEGEEGE".split("") },
  weekly: [["24 Aug", 45], ["31 Aug", 50], ["7 Sep", 40], ["14 Sep", 50], ["21 Sep", 35], ["28 Sep", 50], ["5 Oct", 50], ["12 Oct", 20]],
  plan: { mode: "juz", juz: 28, surah: 67, from: 542, to: 561, days: ["Mon", "Tue", "Wed", "Thu", "Fri"], edits: {} },
  sab: { page: 7, line: 6, n: 10, defN: 10, joinMode: "yesterday" },
  prev: [{ day: "Mon", a: abs(6, 1), b: abs(6, 10) }, { day: "Tue", a: abs(6, 11), b: abs(7, 5) }],
  join: {},
  rec: { a: "G", aMist: 2, aStuck: 1, repeat: false, b: "E", bMist: 0, bStuck: 0, note: "" },
  saved: false, ack: false,
  home: { days: [...DAYS], minutes: 30, mode: "auto", juz: 30, portion: 5, newLines: true, joining: true, studentChooses: true, reminder: "18:30", tasks: [{ id: "p1", t: "Recite Surah al-Mulk before bed" }] },
  stu: { juz: null, reminder: "19:00", tasks: [{ id: "s1", t: "Listen to today's lines (Sudais)" }], whatIf: 10 },
  ticks: {}, heard: false,
  week: ["ok heard", "ok", "ok heard", "ok", "ok", "ok heard"],
  thread: [
    { from: "Teacher", text: "Yusuf is settling well into al-Baqarah, māshā'Allāh. 10 lines a day for now." },
    { from: "Dad", text: "JazakAllahu khayran. He found p.6 lines 3–4 hard at home last night." },
    { from: "Yusuf", text: "I keep mixing up the endings of ayah 20 and 21." },
    { from: "Teacher", text: "Read both ayāt to me first thing tomorrow before your sabaq." },
  ],
  unread: { teacher: 0, parent: 1, student: 0 },
};

/* ===== Derived values ===== */
const memRanges = () => [[1, S.juz1Done + (S.saved ? S.sab.n : 0)], [KAHF.a, KAHF.b], [juzA(27), TOTAL]];
const memIn = (a, b) => memRanges().reduce((t, [x, y]) => t + Math.max(0, Math.min(b, y) - Math.max(a, x) + 1), 0);
const memTotal = () => memIn(1, TOTAL);
const juzFrac = k => memIn(juzA(k), juzB(k)) / (juzB(k) - juzA(k) + 1);
const ragDays = d => d === undefined ? null : d <= 7 ? "G" : d <= 14 ? "A" : "R";
const sabStart = () => abs(S.sab.page, S.sab.line);
const sabEnd = () => sabStart() + S.sab.n - 1;
function setJoinDefaults() {
  const cur = surahAt(sabStart()).i;
  S.prev.forEach((p, i) => { const same = surahAt(p.a).i === cur;
    S.join[p.day] = same && (S.sab.joinMode === "week" || (S.sab.joinMode === "yesterday" && i === S.prev.length - 1)); });
}
setJoinDefaults();

/* revision units: a juz number, or the memorised part of it */
function revUnit(k) {
  if (k === 15 || k === 16) return { key: "kahf", name: "Surah al-Kahf", a: KAHF.a, b: KAHF.b };
  if (k === 1) return { key: 1, name: "Juz 1 (so far)", a: 1, b: S.juz1Done };
  return { key: k, name: `Juz ${k}`, a: juzA(k), b: juzB(k) };
}
const memorisedJuz = () => Array.from({ length: 30 }, (_, i) => i + 1).filter(k => juzFrac(k) > 0);
function planRange() {
  const P = S.plan;
  if (P.mode === "juz") { const u = revUnit(P.juz); return { name: u.name, a: u.a, b: u.b }; }
  if (P.mode === "surah") { const s = SUR[P.surah - 1]; return { name: `Surah ${s.n}`, a: s.a, b: s.b }; }
  return { name: `Pages ${P.from}–${P.to}`, a: abs(P.from, 1), b: abs(P.to, 15) };
}
function portions() {
  const R = planRange(), days = DAYS.filter(d => S.plan.days.includes(d)), n = days.length, L = R.b - R.a + 1;
  return days.map((d, i) => {
    const e = S.plan.edits[d];
    if (e) return { day: d, a: abs(e[0], 1), b: abs(e[1], 15) };
    return { day: d, a: R.a + Math.round(L * i / n), b: R.a + Math.round(L * (i + 1) / n) - 1 };
  });
}
const todayPortion = () => portions().find(p => p.day === TODAY);
function homeUnit() {
  const pick = (S.home.studentChooses && S.stu.juz) || (S.home.mode === "choose" && S.home.juz);
  if (pick) return revUnit(pick);
  const madrasa = S.plan.mode === "juz" ? revUnit(S.plan.juz).key : null;
  const cands = [30, 29, 28, 27, 15, 1].map(revUnit).filter(u => u.key !== madrasa);
  const age = u => S.lastRev[u.key === "kahf" ? 15 : u.key] ?? 99;
  return cands.sort((x, y) => age(y) - age(x))[0];
}
function homePortion() {
  const u = homeUnit(), n = S.home.portion, L = u.b - u.a + 1, i = 2 % n;
  return { ...u, part: i + 1, of: n, a2: u.a + Math.round(L * i / n), b2: u.a + Math.round(L * (i + 1) / n) - 1 };
}
function tasks() {
  if (!S.home.days.includes(TODAY)) return [];
  const t = [], y = S.prev[S.prev.length - 1], H = homePortion();
  if (S.home.newLines) t.push({ id: "new", ic: "book", t: "New lines", s: fmt(sabStart(), sabEnd()) });
  if (S.home.joining) t.push({ id: "join", ic: "link", t: "Join to yesterday", s: fmt(y.a, y.b) });
  t.push({ id: "rev", ic: "loop", t: `${H.name.replace("Surah ", "")}${H.of > 1 ? ` · ${H.part}/${H.of}` : ""}`, s: fmt(H.a2, H.b2) });
  S.home.tasks.forEach(x => t.push({ id: x.id, ic: "star", t: x.t, s: "From Mum & Dad" }));
  S.stu.tasks.forEach(x => t.push({ id: x.id, ic: "star", t: x.t, s: "My own task" }));
  return t;
}
const allDone = () => { const t = tasks(); return t.length > 0 && t.every(x => S.ticks[x.id]); };
const pace = () => S.stu.whatIf * S.plan.days.length;
const finishDate = (p = pace()) => addWeeks((TOTAL - memTotal()) / p);
const streak = () => 11 + (allDone() ? 1 : 0);

/* ===== Small components ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }
const ragPicker = key => `<div class="chips" role="group" aria-label="Grade">${["E", "G", "N"].map(g => `<button class="chip rag ${g}" id="${key}-${g}" data-grade="${key}" data-v="${g}" aria-pressed="${S.rec[key] === g}"><span class="d"></span>${G[g]}</button>`).join("")}</div>`;
const gpill = g => `<span class="gpill ${g}"><span class="dot"></span>${G[g]}</span>`;
const step = (key, val, label) => `<span class="count"><span class="stepper"><button data-st="${key}" data-d="-1" aria-label="Less ${label}">−</button><span class="num">${val}</span><button data-st="${key}" data-d="1" aria-label="More ${label}">+</button></span>${label}</span>`;
const sw = (id, on, label) => `<div class="toggle"><span>${label}</span><button class="switch" role="switch" id="${id}" data-sw="${id}" aria-checked="${on}" aria-label="${esc(label)}"></button></div>`;
const seg = (id, opts, cur) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-seg="${id}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join("")}</div>`;
function ring(size, pct, label, sub) {
  const r = size / 2 - 8, c = 2 * Math.PI * r;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${label} ${sub}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--empty)" stroke-width="11"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--brand)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="${size / 2 + 2}" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="${size / 4.2}" fill="var(--ink)">${label}</text><text x="50%" y="${size / 2 + size / 6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="DM Sans,sans-serif">${sub}</text></svg>`;
}
function grid30(mode) { // mode: "view" opens the sheet; "plan"/"home"/"stu" pick a juz
  const sel = mode === "plan" ? S.plan.mode === "juz" && S.plan.juz : mode === "home" ? S.home.juz : mode === "stu" ? S.stu.juz : null;
  return `<div class="grid30">${Array.from({ length: 30 }, (_, i) => {
    const k = i + 1, f = juzFrac(k), rag = f >= 1 || k === 15 || k === 16 ? ragDays(S.lastRev[k]) : null;
    const cls = f === 0 ? "" : f >= 1 ? rag : (k === 1 ? "P" : rag || "P");
    const picking = mode !== "view", dis = picking && f === 0;
    return `<button class="jz ${f >= 1 ? "full" : ""}" id="jz-${mode}-${k}" ${picking ? `data-pick="${mode}"` : "data-juz"} data-k="${k}" ${dis ? "disabled" : ""} ${picking ? `aria-pressed="${sel === k || (sel && revUnit(sel).key === "kahf" && (k === 15 || k === 16))}"` : ""} aria-label="Juz ${k}, ${Math.round(f * 100)}% memorised">${f ? `<span class="f ${cls}" style="height:${Math.max(10, f * 100)}%"></span>` : ""}<span>${k}</span></button>`;
  }).join("")}</div>`;
}
const legend = `<div class="legend"><span><i style="background:var(--g)"></i>Revised ≤ 1 wk</span><span><i style="background:var(--a)"></i>1–2 wks</span><span><i style="background:var(--r)"></i>2+ wks</span><span><i style="background:var(--part)"></i>Learning now</span></div>`;
const tile = (x, can) => `<button class="tile ${S.ticks[x.id] ? "done" : ""}" ${can ? `data-tick="${x.id}"` : "disabled"} id="t-${x.id}" aria-pressed="${!!S.ticks[x.id]}"><span class="ic">${I[x.ic]}</span><span class="tick">${S.ticks[x.id] ? I.check : ""}</span><b>${esc(x.t)}</b><small class="num">${esc(x.s)}</small></button>`;
function weekStrip() {

  return `<div class="week">${labels.map((d, i) => {
    if (i === 6) return `<div class="${allDone() ? "ok" : ""} ${S.heard ? "heard" : ""} today">${d}</div>`;
    return `<div class="${S.home.days.includes(d) ? S.week[i] : "off"}">${d}</div>`; }).join("")}</div>`;
}

    ${sw("joining", H.joining, "Join to yesterday's lines")}
    ${sw("studentChooses", H.studentChooses, "Let Yusuf pick his home juz")}
    <div class="toggle"><label for="prem">Reminder</label><input type="time" id="prem" data-time="home" value="${H.reminder}"></div>
  </div>
  <div class="card sunk">
    <div class="eyebrow">Extra tasks</div>
    ${H.tasks.map(x => `<div class="taskrow"><span>${esc(x.t)}</span><button class="iconbtn" data-del="home:${x.id}" aria-label="Remove">${I.x}</button></div>`).join("")}
    <form class="composer" data-add="home"><input type="text" id="addhome" placeholder="Add a task, e.g. Recite Yasin on Fridays" aria-label="New task"><button class="btn sm">Add</button></form>
  </div>`;
}

function sToday() {
  const t = tasks(), d = t.filter(x => S.ticks[x.id]).length, f1 = juzFrac(1), juz = memTotal() / 300;
  const j1 = memIn(juzA(1), juzB(1)), j1t = juzB(1) - juzA(1) + 1;
  return `<div class="card">
    <div class="hero">
      ${ring(118, memTotal() / TOTAL, juz.toFixed(1), "of 30 juz")}
      <div class="side">
        <span class="streak">${I.flame}${streak()}-day streak</span>
        <div><div class="spread small"><b>Juz 1</b><span class="muted num">${j1}/${j1t}</span></div><div class="meter"><i style="width:${f1 * 100}%"></i></div></div>
        <div class="small muted">Hafiz by <b style="color:var(--ink)">${monthYr(finishDate())}</b></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="spread"><h3>Tonight</h3><span class="pill num">${d}/${t.length} · ~${S.home.minutes} min</span></div>
    ${t.length ? `<div class="tiles">${t.map(x => tile(x, true)).join("")}</div>` : `<p class="muted">Rest day. Enjoy it!</p>`}
    ${allDone() ? `<p class="small"><b>All done, māshā'Allāh!</b> Ask Mum or Dad to listen.</p>` : ""}
  </div>
  <div class="card">
    <div class="spread"><h3>My Quran</h3><span class="muted small">Tap a juz</span></div>
    ${grid30("view")}${legend}
  </div>
  ${report(true)}`;
}

function sPlan() {
  const can = S.home.studentChooses, u = homeUnit();
  return `<div class="card">
    <div class="eyebrow">My home revision</div>
    ${can ? `${grid30("stu")}<p class="small muted">Tonight: <b style="color:var(--ink)">${esc(u.name)}</b>${S.stu.juz ? ` · <button class="chip" id="stuauto" style="padding:2px 8px">Let the app choose</button>` : " (chosen for you)"}</p>`
      : `<div class="lock">${I.lock}Mum and Dad choose your home juz.</div>`}
  </div>
  <div class="card">
    <div class="eyebrow">My daily goal for new lines</div>
    <div class="spread"><span class="big num">${S.stu.whatIf} lines</span><span class="muted small">→ Hafiz by <b style="color:var(--ink)">${monthYr(finishDate())}</b></span></div>
    <input type="range" id="whatif" min="5" max="30" value="${S.stu.whatIf}" aria-label="New lines a day">
    <p class="small muted">Your teacher sets the actual lesson. This shows what's possible.</p>
  </div>
  <div class="card">
    <div class="toggle"><label for="srem">My reminder</label><input type="time" id="srem" data-time="stu" value="${S.stu.reminder}"></div>
  </div>
  <div class="card sunk">
    <div class="eyebrow">My own tasks</div>
    ${S.stu.tasks.map(x => `<div class="taskrow"><span>${esc(x.t)}</span><button class="iconbtn" data-del="stu:${x.id}" aria-label="Remove">${I.x}</button></div>`).join("")}
    <form class="composer" data-add="stu"><input type="text" id="addstu" placeholder="Add a task" aria-label="New task"><button class="btn sm">Add</button></form>
  </div>`;
}

function barChart() {
  const W = 320, H = 130, pad = 22, wk = S.weekly.map(([l, n], i) => [l, i === S.weekly.length - 1 && S.saved ? n + S.sab.n : n]);
  const max = 60, bw = (W - pad) / wk.length, y = v => H - 18 - (v / max) * (H - 30);
  const avg = Math.round(wk.slice(-5, -1).reduce((t, [, n]) => t + n, 0) / 4);
  return `<svg class="chart num" viewBox="0 0 ${W} ${H}" role="img" aria-label="New lines per week, last 8 weeks">
    ${[0, 30, 60].map(v => `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`).join("")}
    ${wk.map(([l, n], i) => `<rect x="${pad + i * bw + 4}" y="${y(n)}" width="${bw - 8}" height="${y(0) - y(n)}" rx="4" fill="${i === wk.length - 1 ? "var(--part)" : "var(--brand-soft)"}" stroke="var(--brand)" stroke-width="${i === wk.length - 1 ? 0 : 1}"/><text x="${pad + i * bw + bw / 2}" y="${H - 4}" font-size="9" text-anchor="middle" fill="var(--muted)">${l}</text>`).join("")}
    <line x1="${pad}" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--a)" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${W - 2}" y="${y(avg) - 4}" font-size="10" text-anchor="end" fill="var(--a)">avg ${avg}</text>
  </svg>`;
}
function donut(arr) {
  const n = { E: 0, G: 0, N: 0 }; arr.forEach(g => n[g]++); const tot = arr.length, r = 34, c = 2 * Math.PI * r; let off = 0;
  const segs = ["E", "G", "N"].map(g => { const len = c * n[g] / tot, s = `<circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--${g === "E" ? "g" : g === "G" ? "a" : "r"})" stroke-width="12" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 45 45)"/>`; off += len; return s; }).join("");
  return `<div class="row" style="gap:14px;flex-wrap:nowrap"><svg width="90" height="90" viewBox="0 0 90 90" role="img" aria-label="Grades">${segs}<text x="45" y="50" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="18" fill="var(--ink)">${Math.round(n.E / tot * 100)}%</text></svg>
  <div style="display:flex;flex-direction:column;gap:5px;min-width:0">${["E", "G", "N"].map(g => `<span class="row" style="gap:6px">${gpill(g)}<b class="num">${n[g]}</b></span>`).join("")}</div></div>`;
}
function progress() {
  const hist = { A: [...S.history.A, ...(S.saved ? [S.rec.a] : [])], B: [...S.history.B, ...(S.saved ? [S.rec.b] : [])] };
  const order = [[30, "Juz 30"], [29, "Juz 29"], [28, "Juz 28"], [27, "Juz 27"], [15, "Al-Kahf"]];
  const p = pace(), j1rem = (juzB(1) - juzA(1) + 1) - memIn(juzA(1), juzB(1));
  return `<div class="stats num">
    <div class="stat"><b>${(memTotal() / 300).toFixed(1)}</b><span>juz memorised</span></div>
    <div class="stat"><b>${monthYr(finishDate())}</b><span>projected Hafiz</span></div>
    <div class="stat"><b style="color:var(--a)">${streak()}</b><span>day home streak</span></div>
    <div class="stat"><b>${S.weekly[7][1] + (S.saved ? S.sab.n : 0)}</b><span>new lines this week</span></div>
  </div>
  <div class="card"><div class="spread"><h3>Quran map</h3><span class="muted small">Tap a juz</span></div>${grid30("view")}${legend}</div>
  <div class="card"><div class="eyebrow">New lines per week</div>${barChart()}</div>
  <div class="card">
    <div class="eyebrow">What if… lines a day</div>
    <div class="spread"><span class="big num">${S.stu.whatIf}/day</span><span class="small muted num">${p} a week → Hafiz <b style="color:var(--ink)">${monthYr(finishDate())}</b></span></div>
    <input type="range" id="whatif" min="5" max="30" value="${S.stu.whatIf}" aria-label="New lines a day">
  </div>
  <div class="card">
    <div class="eyebrow">Grades · last ${hist.A.length} lessons</div>
    ${donut([...hist.A, ...hist.B])}
    <div class="small muted">A · Manzil</div><div class="dots">${hist.A.map(g => `<i class="${g}" title="${G[g]}"></i>`).join("")}</div>
    <div class="small muted">B · Sabaq</div><div class="dots">${hist.B.map(g => `<i class="${g}" title="${G[g]}"></i>`).join("")}</div>
  </div>
  <div class="card">
    <div class="eyebrow">Milestones</div>
    ${order.map(([k, n]) => `<div class="mile"><span class="m done"></span><span>${n}</span><span class="muted small">${S.completed[k][0]}</span></div>`).join("")}
    <div class="mile"><span class="m now"></span><span><b>Juz 1</b></span><span class="small"><b>${monthYr(addWeeks(j1rem / p))}</b></span></div>
    <div class="mile"><span class="m"></span><span>Halfway (15 juz)</span><span class="muted small">${monthYr(addWeeks((15 * 300 - memTotal()) / p))}</span></div>
    <div class="mile"><span class="m"></span><span>Hafiz · 30 juz</span><span class="muted small">${monthYr(finishDate())}</span></div>
  </div>`;
}

function sheet(k) {
  const a = juzA(k), b = juzB(k), tot = b - a + 1, m = memIn(a, b), f = m / tot;
  const surahs = SUR.filter(s => s.a <= b && s.b >= a).map(s => { const x = Math.max(s.a, a), y = Math.min(s.b, b); return { n: s.n, t: y - x + 1, m: memIn(x, y) }; });
  const rev = S.lastRev[k], rg = ragDays(rev), done = S.completed[k], grades = (S.juzGrades[k] || "").split("").filter(Boolean);
  // ETA in the curriculum order: Juz 1, 2, 3 … 26 (Kahf already done)
  let cum = 0, eta = null;
  for (let j = 1; j <= 26; j++) { cum += (juzB(j) - juzA(j) + 1) - memIn(juzA(j), juzB(j)); if (j === k) { eta = addWeeks(cum / pace()); break; } }
  const colour = rg === "G" ? "var(--g)" : rg === "A" ? "var(--a)" : "var(--r)";
  const act = S.role === "teacher" ? (m ? `<button class="btn" data-use="plan" data-k="${k}">Revise in madrasa this week</button>` : "")
    : S.role === "parent" ? (m ? `<button class="btn" data-use="home" data-k="${k}">Use for home revision</button>` : "")
    : (m && S.home.studentChooses ? `<button class="btn" data-use="stu" data-k="${k}">Revise this at home</button>` : "");
  return `<div class="scrim" data-close><div class="sheet" role="dialog" aria-label="Juz ${k}">
    <div class="grab"></div>
    <div class="spread"><h2>Juz ${k}</h2><button class="iconbtn" data-close aria-label="Close">${I.x}</button></div>
    <div class="row" style="flex-wrap:nowrap;gap:14px">
      ${ring(96, f, Math.round(f * 100) + "%", "memorised")}
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <div class="small muted num">${m} of ${tot} lines · p.${pos(a).p}–${pos(b).p}</div>
        ${done ? `<div><b>Completed ${done[0]}</b><div class="small muted">took ${done[1]} weeks</div></div>`
          : eta ? `<div><b>${m ? "Finish" : "Start → finish"} ~${monthYr(eta)}</b><div class="small muted">at ${pace()} lines a week</div></div>` : ""}
        ${rev !== undefined ? `<div class="row" style="gap:6px"><span class="dot" style="color:${colour};width:10px;height:10px"></span><span class="small">Revised ${rev === 0 ? "today" : rev + " days ago"}</span></div>` : ""}
      </div>
    </div>
    ${grades.length ? `<div><div class="eyebrow">Recent revision grades</div><div class="row" style="gap:6px;margin-top:6px">${grades.map(gpill).join("")}</div></div>` : ""}
    <div class="eyebrow">Surahs in this juz</div>
    ${surahs.map(s => `<div class="surah"><span>${s.n}</span><div class="meter"><i class="${s.m === s.t ? "full" : ""}" style="width:${s.m / s.t * 100}%"></i></div><span class="small muted num" style="text-align:right">${Math.round(s.m / s.t * 100)}%</span></div>`).join("")}
    ${act}
  </div></div>`;
}

function messages() {
  return `<p class="small muted">Everyone sees every message: teacher, Mum, Dad and Yusuf.</p>
  <div class="thread">${S.thread.map(m => m.sys ? `<div class="sys">${esc(m.text)}</div>` : `<div class="msg ${m.from === ME[S.role] ? "me" : ""}"><div class="from">${esc(m.from)}</div>${esc(m.text)}</div>`).join("")}</div>
  <form class="composer" data-add="msg"><input type="text" id="msg" placeholder="Message as ${ME[S.role]}…" autocomplete="off" aria-label="Message"><button class="btn">Send</button></form>`;
}

/* ===== Events ===== */
const sys = (text, who) => { S.thread.push({ sys: true, text }); Object.keys(S.unread).filter(r => r !== who).forEach(r => S.unread[r]++); };
document.addEventListener("click", e => {
  const t = e.target.closest("button, .scrim"); if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined && (t.tagName === "BUTTON" || e.target === t)) { S.sheet = null; return render(); }
  if (t.classList.contains("scrim")) return;
  if (d.role) { S.role = d.role; S.tab = "today"; S.sheet = null; return render(); }
  if (d.tab) { S.tab = d.tab; if (d.tab === "messages") S.unread[S.role] = 0; return render(); }
  if (d.goto) { S.tab = d.goto; return render(); }
  if (d.grade) { S.rec[d.grade] = d.v; return render(); }
  if (d.st) { const k = d.st, n = +d.d;
    if (k === "lines") S.sab.n = Math.min(40, Math.max(1, S.sab.n + n));
    else if (k === "defn") { S.sab.defN = Math.min(40, Math.max(1, S.sab.defN + n)); S.sab.n = S.sab.defN; }
    else S.rec[k] = Math.max(0, S.rec[k] + n);
    return render(); }
  if (d.join) { S.join[d.join] = !S.join[d.join]; return render(); }
  if (d.sw) { const map = { repeat: [S.rec, "repeat"], newLines: [S.home, "newLines"], joining: [S.home, "joining"], studentChooses: [S.home, "studentChooses"] }[d.sw]; map[0][map[1]] = !map[0][map[1]]; return render(); }
  if (d.seg) {
    if (d.seg === "pmode") { S.plan.mode = d.v; S.plan.edits = {}; }
    if (d.seg === "joinmode") { S.sab.joinMode = d.v; setJoinDefaults(); }
    if (d.seg === "hmode") S.home.mode = d.v;
    if (d.seg === "portion") S.home.portion = +d.v;
    return render();
  }
  if (d.pick) { const k = +d.k;
    if (d.pick === "plan") { S.plan.juz = k; S.plan.edits = {}; }
    if (d.pick === "home") S.home.juz = k;
    if (d.pick === "stu") S.stu.juz = k;
    return render(); }
  if (d.juz !== undefined) { S.sheet = +d.k; return render(); }
  if (d.use) { const k = +d.k;
    if (d.use === "plan") { S.plan.mode = "juz"; S.plan.juz = k; S.plan.edits = {}; toast(`This week: ${revUnit(k).name}`); }
    if (d.use === "home") { S.home.mode = "choose"; S.home.juz = k; toast(`Home revision: ${revUnit(k).name}`); }
    if (d.use === "stu") { S.stu.juz = k; toast(`Tonight: ${revUnit(k).name}`); }
    S.sheet = null; return render(); }
  if (d.surah) { S.plan.surah = +d.surah; S.plan.edits = {}; return render(); }
  if (d.pday) { const a = S.plan.days; S.plan.days = a.includes(d.pday) ? a.filter(x => x !== d.pday) : [...a, d.pday]; S.plan.edits = {}; return render(); }
  if (d.hday) { const a = S.home.days; S.home.days = a.includes(d.hday) ? a.filter(x => x !== d.hday) : [...a, d.hday]; return render(); }
  if (d.mins) { S.home.minutes = +d.mins; return render(); }
  if (d.editday) { S.editDay = d.editday; return render(); }
  if (d.saveday) { const f = +$("#ef").value, to = +$("#et").value; if (f >= 1 && to >= f && to <= 604) S.plan.edits[d.saveday] = [f, to]; S.editDay = null; return render(); }
  if (d.tick) { S.ticks[d.tick] = !S.ticks[d.tick]; if (!allDone()) S.heard = false; else toast("All done! Streak kept going."); return render(); }
  if (d.del) { const [w, id] = d.del.split(":"); const o = w === "home" ? S.home : S.stu; o.tasks = o.tasks.filter(x => x.id !== id); return render(); }
  if (t.id === "resetsplit") { S.plan.edits = {}; return render(); }
  if (t.id === "stuauto") { S.stu.juz = null; return render(); }
  if (t.id === "save") {
    S.rec.note = $("#note").value.trim(); S.saved = true; S.ack = false;
    sys(`Teacher recorded ${TODAY}: manzil ${G[S.rec.a]}, sabaq ${G[S.rec.b]} (${S.sab.n} lines)`, "teacher");
    toast("Saved. Parents and Yusuf notified."); return render();
  }
  if (t.id === "ack") { S.ack = true; sys("Dad acknowledged today's report", "parent"); toast("Acknowledged"); return render(); }
  if (t.id === "heard") { S.heard = true; sys("Dad listened to Yusuf's home revision", "parent"); toast("Logged"); return render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "note") S.rec.note = t.value;
  if (t.id === "whatif") { S.stu.whatIf = +t.value; const v = t.value; render(); const n = $("#whatif"); if (n) { n.value = v; n.focus(); } }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.num) { const v = +t.value; if (d.num === "page" && v >= 1 && v <= 604) S.sab.page = v; if (d.num === "line" && v >= 1 && v <= 15) S.sab.line = v; setJoinDefaults(); render(); }
  if (d.plan) { const v = +t.value; if (v >= 1 && v <= 604) S.plan[d.plan] = v; if (S.plan.to < S.plan.from) S.plan.to = S.plan.from; S.plan.edits = {}; render(); }
  if (d.time) { (d.time === "home" ? S.home : S.stu).reminder = t.value; toast(`Reminder set for ${t.value}`); }
});
document.addEventListener("submit", e => {
  e.preventDefault(); const w = e.target.dataset.add, inp = e.target.querySelector("input"), v = inp.value.trim(); if (!v) return;
  if (w === "msg") { S.thread.push({ from: ME[S.role], text: v }); Object.keys(S.unread).filter(r => r !== S.role).forEach(r => S.unread[r]++); }
  else (w === "home" ? S.home : S.stu).tasks.push({ id: w + Date.now(), t: v });
  render(); const n = document.getElementById(inp.id); if (n) n.focus();
});
render();
</script>

</html>
